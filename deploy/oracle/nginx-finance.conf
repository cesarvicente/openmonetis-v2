# nginx - finance.cvicent.com.br (OpenMonetis) e finance-files.cvicent.com.br (Garage S3)
# Cloudflare em Full (strict): o edge conecta na 443 com o certificado "finance".

server {
    listen 80;
    listen [::]:80;
    server_name finance.cvicent.com.br finance-files.cvicent.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance.cvicent.com.br;

    ssl_certificate     /etc/letsencrypt/live/finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FINANCE_SSL:10m;
    ssl_session_tickets off;

    # $remote_addr passa a ser o IP real do visitante; X-Real-IP e sempre sobrescrito
    # e o web o repassa a API (TRUSTED_CLIENT_IP_HEADER) para o rate limit do login.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance-files.cvicent.com.br;

    ssl_certificate     /etc/letsencrypt/live/finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FINANCE_SSL:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Anexos ate 50 MiB; o upload vai direto do navegador por URL assinada.
    client_max_body_size 51M;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        # A assinatura S3 inclui o Host; ele precisa chegar intacto ao Garage.
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
